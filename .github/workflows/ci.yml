name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

# Runners are pinned to an explicit image: ubuntu-latest is migrating from
# Ubuntu 24.04 to 26.04, which would change the environment without a commit.
#
# Only the lint job lets setup-go save the Go cache. setup-go derives its cache
# key from the OS, the Go version and go.mod, so parallel jobs that used it all
# raced to reserve the same key ("Unable to reserve cache"). The other jobs
# turn it off and keep their own per-job cache (the "Cache Go" step), because
# race, coverage, benchmark and fuzz builds fill the build cache differently.
env:
  GOTOOLCHAIN: local

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0

  test-race:
    name: Test (race)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Cache Go (race)
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-race-${{ hashFiles('go.mod', 'go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            go-${{ runner.os }}-race-${{ hashFiles('go.mod', 'go.sum') }}-
            go-${{ runner.os }}-race-
      - name: Run tests with race detector
        run: go test -race -count=1 -skip ^Example ./...

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Cache Go (coverage)
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-coverage-${{ hashFiles('go.mod', 'go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            go-${{ runner.os }}-coverage-${{ hashFiles('go.mod', 'go.sum') }}-
            go-${{ runner.os }}-coverage-
      - name: Run tests with coverage
        run: go test -coverprofile=coverage.out -covermode=atomic -skip ^Example ./...
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          # Go emits a coverprofile only: turn off the gcov, xcode and pycoverage
          # plugins and the file search, which do not apply and only log warnings.
          plugins: noop
          disable_search: true

  bench:
    name: Benchmark
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Cache Go (bench)
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-bench-${{ hashFiles('go.mod', 'go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            go-${{ runner.os }}-bench-${{ hashFiles('go.mod', 'go.sum') }}-
            go-${{ runner.os }}-bench-
      - name: Run benchmarks (smoke)
        run: go test -bench=. -benchmem -benchtime=1x -skip ^Example ./...

  fuzz:
    name: Fuzz (smoke)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Cache Go (fuzz)
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-fuzz-${{ hashFiles('go.mod', 'go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            go-${{ runner.os }}-fuzz-${{ hashFiles('go.mod', 'go.sum') }}-
            go-${{ runner.os }}-fuzz-
      - name: FuzzRead — end-to-end entry point
        run: go test -fuzz=FuzzRead -fuzztime=10s -race .
      - name: FuzzParseEXIF — EXIF/TIFF parser
        run: go test -fuzz=FuzzParseEXIF -fuzztime=10s -race ./exif/...
      - name: FuzzParseIPTC — IPTC IIM parser
        run: go test -fuzz=FuzzParseIPTC -fuzztime=10s -race ./iptc/...
      - name: FuzzParseXMP — XMP/RDF parser
        run: go test -fuzz=FuzzParseXMP -fuzztime=10s -race ./xmp/...
      - name: FuzzJPEGExtract — JPEG container extractor
        run: go test -fuzz=FuzzJPEGExtract -fuzztime=10s -race ./format/jpeg/...
      - name: FuzzHEIFExtract — HEIF/AVIF container extractor
        run: go test -fuzz=FuzzHEIFExtract -fuzztime=10s -race ./format/heif/...
